# ==========================================================================
# VM Security Lab — 운영 스택 (VM 에서 실행)
#
#   [인터넷] → cloudflared(터널) → nginx:8080 → web:8000(gunicorn) → db:3306
#
# 네트워크를 두 개로 분리한다:
#   frontend : nginx ↔ cloudflared          (외부 트래픽 경로)
#   backend  : nginx ↔ web ↔ db, internal:true  (DB는 외부로 나갈 수 없음)
#
# db 를 internal 네트워크에만 두는 이유:
#   컨테이너가 침해되어도 DB에서 외부로 데이터를 빼내는 경로(egress)가 없다.
#
# 사용법:
#   docker compose up -d --build
#   docker compose --profile tunnel up -d      # Cloudflare Tunnel 포함
#   docker compose logs -f web
# ==========================================================================

# ★ 프로젝트 이름을 파일에 고정한다 (compose spec 의 top-level `name`).
#
#   고정하지 않으면 compose 는 **실행한 디렉터리 이름**에서 프로젝트명을
#   유추한다. 그런데 배포 워크플로는 COMPOSE_PROJECT_NAME=vmlab 을 주고,
#   사용자가 터미널에서 직접 실행할 때는 그 환경변수가 없다.
#   → 리소스 이름이 갈린다:
#       배포:            vmlab_db_data     (컨테이너 vmlab-db …)
#       사람이 수동 실행: liinux-_db_data   (디렉터리가 Liinux- 라서)
#
#   실제로 이것 때문에 사고가 났다. 옛 비밀번호가 남은 DB 볼륨을 지우려고
#   `sudo docker compose down -v` 를 실행했는데, compose 는 존재하지 않는
#   `liinux-_db_data` 를 대상으로 삼아 **아무것도 지우지 않고 조용히 성공**
#   했다. 볼륨은 그대로 남아 배포가 계속 Access denied 로 실패했다.
#   (down 은 지울 게 없어도 오류를 내지 않으므로 알아채기 어렵다)
#
#   여기에 name 을 박아두면 어디서 실행하든 항상 vmlab 이 되어
#   배포와 수동 조작이 같은 리소스를 가리킨다.
name: vmlab

services:

  # ------------------------------------------------------------------ DB
  db:
    image: mariadb:11.4
    container_name: vmlab-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 로컬 파일을 읽어들이는 SQLi 기법(LOAD DATA LOCAL INFILE)을 차단한다
      - --local-infile=0
      # 느린 쿼리를 남겨 대시보드 쿼리 성능을 추적한다
      - --slow-query-log=1
      - --long-query-time=1
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 설정하세요}
      MARIADB_DATABASE: ${DB_NAME:-vmlab}
      MARIADB_USER: ${DB_USER:-vmlab}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      # root 의 원격 접속을 막는다 (컨테이너 내부 소켓만 허용)
      MARIADB_ROOT_HOST: localhost
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    # 포트를 호스트에 노출하지 않는다.
    # DB 관리가 필요하면: docker compose exec db mariadb -uvmlab -p vmlab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------ 앱
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${DEPLOYED_AT:-}
    image: vmlab-web:${APP_VERSION:-dev}
    container_name: vmlab-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env 값을 덮어써 컨테이너 네트워크에 맞춘다
      DB_HOST: db
      DB_PORT: "3306"
      UPLOAD_DIR: /app/uploads
      GUNICORN_BIND: 0.0.0.0:8000
    volumes:
      # 업로드 파일은 컨테이너 재생성과 무관하게 보존된다
      - uploads:/app/uploads
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    # 포트를 호스트에 노출하지 않는다 — Nginx 를 반드시 거치게 강제한다
    security_opt:
      - no-new-privileges:true
    # 앱은 업로드 디렉터리에만 쓰기가 필요하다.
    # 나머지 파일시스템을 읽기전용으로 만들면 웹셸이 파일을 심기 어려워진다.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default_logging

  # ------------------------------------------------------------------ Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: vmlab-nginx
    restart: unless-stopped
    ports:
      # ${BIND_ADDR} 로 노출 범위를 제어한다.
      #   127.0.0.1 (기본) : 호스트 로컬에서만. cloudflared 가 여기로 붙는다.
      #   0.0.0.0          : LAN 전체 공개 (호스트 전용 네트워크 실습 시)
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/app.conf:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - frontend
      - backend
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default_logging

  # ------------------------------------------------------------------ Cloudflare Tunnel
  # 요구사항 #2 (외부 접속) 담당.
  # 아웃바운드 연결만 사용하므로 공유기에 포트를 열 필요가 없다.
  #
  # profiles 로 분리한 이유: vulnerable 모드 실습 중에 실수로 터널이
  # 올라가면 취약한 앱이 인터넷에 노출된다. 명시적으로만 켜지게 한다.
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vmlab-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # 변수명은 cloudflared 가 네이티브로 읽는 TUNNEL_TOKEN 으로 통일한다.
      # (GitHub Secret 이름은 CLOUDFLARE_TUNNEL_TOKEN 이지만,
      #  deploy.yml 이 .env 에 기록할 때 TUNNEL_TOKEN 으로 써 넣는다.)
      #
      # ★ 여기에 `${TUNNEL_TOKEN:?...}` (required 문법)을 쓰면 안 된다.
      #   compose 의 변수 보간은 **파일을 파싱하는 시점에 전체에 적용**되며,
      #   profile 로 제외된 서비스도 예외가 아니다. 따라서 터널을 전혀
      #   쓰지 않는 `docker compose build web` 조차 이 줄 때문에 실패한다.
      #   실제로 배포가 '이미지 빌드' 단계에서 이 에러로 죽었다:
      #     error while interpolating services.cloudflared.environment.TUNNEL_TOKEN:
      #     required variable TUNNEL_TOKEN is missing a value
      #   토큰 검증은 파일이 아니라 터널을 켜는 스크립트에서 한다
      #   (scripts/setup_tunnel.sh 가 실행 전에 확인).
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # 터널이 바라볼 로컬 서비스는 Cloudflare 대시보드에서 지정한다:
      #   Public hostname → Service: http://nginx:8080
      TUNNEL_METRICS: 0.0.0.0:2000
    networks:
      - frontend
    depends_on:
      nginx:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default_logging

  # ------------------------------------------------------------------ Quick Tunnel
  # 도메인/계정이 없어도 외부 공개가 되는 경로.
  # Cloudflare 가 https://<랜덤>.trycloudflare.com 주소를 즉석에서 발급한다.
  #
  # 위 cloudflared(named tunnel)와의 차이:
  #   - 토큰 불필요, 계정 불필요, 도메인 불필요
  #   - 대신 주소가 매번 바뀌고 컨테이너를 내리면 사라진다 (영구 주소 아님)
  #   - Cloudflare 가 SLA 를 보장하지 않는다 (테스트/시연 용도)
  #
  # 두 서비스를 동시에 띄우지 않는다. 둘 다 nginx:8080 을 바라보므로
  # 동시 실행이 기능적으로 깨지진 않지만, 공개 주소가 2개가 되어
  # "무엇이 노출 중인지" 파악이 어려워진다 — 노출 경로는 하나만 유지한다.
  #   ./scripts/setup_tunnel.sh --quick
  quicktunnel:
    image: cloudflare/cloudflared:latest
    container_name: vmlab-quicktunnel
    restart: unless-stopped
    profiles: ["quick"]
    # --url 로 대상을 지정하면 토큰 없이 임시 터널이 열린다.
    # 발급된 주소는 컨테이너 로그에 출력된다.
    command: tunnel --no-autoupdate --url http://nginx:8080
    networks:
      - frontend
    depends_on:
      nginx:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default_logging


# ==========================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    # 외부로 나가는 경로를 차단한다 (DB 데이터 유출 방지)
    internal: true

volumes:
  db_data:
    driver: local
  uploads:
    driver: local
  nginx_cache:
    driver: local
