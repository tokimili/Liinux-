# ==========================================================================
# 애플리케이션 리버스 프록시
#
# 요청 흐름:
#   cloudflared → nginx:8080 → web:8000 (gunicorn)
# ==========================================================================

upstream vmlab_app {
    # Docker 내부 DNS 가 web 컨테이너를 해석한다.
    server web:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen      8080;
    server_name _;

    # 프록시 공통 헤더
    #
    # X-Forwarded-For 를 이어붙이는 것이 중요하다.
    # 앱의 get_client_ip() 는 이 목록을 **오른쪽부터** TRUSTED_PROXY_COUNT 만큼
    # 신뢰하고 건너뛰어 실제 클라이언트 IP를 찾는다.
    # 왼쪽부터 읽으면 공격자가 헤더를 위조해 로그를 오염시킬 수 있다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # Cloudflare 가 붙여주는 헤더를 그대로 전달한다.
    # 앱은 CF-Connecting-IP 를 최우선으로 사용하고, CF-IPCountry 를
    # access_logs.country 에 기록해 대시보드에서 국가별 분석을 한다.
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry      $http_cf_ipcountry;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_buffering       on;

    # 앱이 5xx 를 내면 Nginx 기본 오류 페이지 대신 앱 응답을 그대로 보낸다
    # (앱의 errors/error.html 이 스택트레이스 없이 안전하게 렌더된다)
    proxy_intercept_errors off;

    # 동시 연결 제한 (한 IP 가 커넥션을 고갈시키지 못하게)
    limit_conn perip 24;

    # ------------------------------------------------------------------
    # Nginx 자체 헬스체크 — compose healthcheck 전용.
    # 앱/DB 를 거치지 않으므로 Nginx 만 살아있는지 빠르게 확인한다.
    # access_log 를 끄지 않으면 15초마다 로그가 쌓인다.
    # ------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    # ------------------------------------------------------------------
    # 애플리케이션 헬스체크 — 배포 게이트가 사용한다.
    # DB 연결과 로그 writer 상태까지 포함된 JSON 을 반환한다.
    # 외부에서 내부 상태를 캐지 못하게 로컬 대역만 허용한다.
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;

        allow 127.0.0.1;
        allow 172.16.0.0/12;   # Docker 기본 브리지 대역
        allow 192.168.0.0/16;  # 호스트 전용 / LAN
        allow 10.0.0.0/8;
        deny  all;

        proxy_pass http://vmlab_app;
    }

    # ------------------------------------------------------------------
    # 정적 파일 — 앱을 거치지 않고 Nginx 가 직접 서빙한다.
    # 앱의 LOG_EXCLUDE_PREFIXES 에 /static/ 이 있어 DB 로그도 남지 않는다.
    # (대시보드가 CSS/JS 요청으로 오염되지 않게 하는 의도)
    # ------------------------------------------------------------------
    location /static/ {
        proxy_pass http://vmlab_app;
        proxy_cache_valid 200 10m;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # 검색엔진 차단 — 실습용 서비스가 색인되면 안 된다
    location = /robots.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ------------------------------------------------------------------
    # 로그인/회원가입 — 가장 엄격한 rate limit.
    # burst=5 nodelay: 정상 사용자의 오타 몇 번은 통과시키되
    # 자동화된 대량 시도는 즉시 429 로 끊는다.
    # ------------------------------------------------------------------
    location ~ ^/auth/(login|register)$ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://vmlab_app;
    }

    # ------------------------------------------------------------------
    # 대시보드 폴링 API
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://vmlab_app;
    }

    # ------------------------------------------------------------------
    # 그 외 모든 요청
    # ------------------------------------------------------------------
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://vmlab_app;
    }

    # ------------------------------------------------------------------
    # 흔한 스캐너 경로를 앱까지 보내지 않고 즉시 차단한다.
    #
    # 주의: 이 규칙은 secure 모드의 잡음 감소용이다.
    # vulnerable 모드 실습에서 이 경로를 써야 한다면
    # 아래 블록을 주석 처리한다 (Nginx 가 먼저 막아버리기 때문).
    # ------------------------------------------------------------------
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        access_log /var/log/nginx/access.log main;
        return 404;
    }

    location ~* /(\.env|\.git|wp-admin|wp-login|phpmyadmin|\.aws|\.ssh) {
        access_log /var/log/nginx/access.log main;
        return 404;
    }
}
