# ==========================================================================
# Nginx 메인 설정 (컨테이너용)
# ==========================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------- 로그
    # 접속 기록의 1차 소스는 애플리케이션 DB(access_logs)지만,
    # Nginx 로그도 남겨 두어 앱이 죽었을 때의 요청까지 추적한다.
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'cf_ip="$http_cf_connecting_ip" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # ---------------------------------------------------------------- 성능
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ---------------------------------------------------------------- 보안
    # 버전 노출 차단 — 공격자에게 취약 버전 정보를 주지 않는다
    server_tokens  off;

    # 업로드 상한 (앱의 MAX_UPLOAD_MB 와 맞춘다).
    # Nginx 단에서 먼저 끊어 앱까지 도달하지 않게 한다.
    client_max_body_size  6m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    client_body_buffer_size 128k;

    # Slowloris 완화: 헤더/본문을 천천히 보내는 연결을 조기 종료
    send_timeout 20s;
    reset_timedout_connection on;

    # ---------------------------------------------------------------- Rate Limit
    # 브루트포스와 스캐너를 애플리케이션 앞단에서 1차 차단한다.
    # 앱의 로그인 잠금(LOGIN_MAX_ATTEMPTS)과 2중으로 방어한다.
    #
    # 실제 클라이언트 IP 기준으로 제한해야 하므로 $limit_key 를 쓴다
    # (Cloudflare 를 거치면 $remote_addr 은 CF 엣지 IP 가 된다).
    map $http_cf_connecting_ip $limit_key {
        default   $http_cf_connecting_ip;
        ""        $binary_remote_addr;
    }

    limit_req_zone $limit_key zone=general:10m rate=30r/s;
    limit_req_zone $limit_key zone=login:10m   rate=12r/m;
    limit_req_zone $limit_key zone=api:10m     rate=60r/m;
    limit_req_status 429;
    limit_conn_zone $limit_key zone=perip:10m;

    # ---------------------------------------------------------------- 압축
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
