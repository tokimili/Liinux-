name: Deploy to VM

# ==========================================================================
# 로컬 VM 자동 배포 (요구사항 #1 — 1차 목표).
#
# ★ pull 모델을 쓰는 이유
#   GitHub 은 NAT 뒤에 있는 가정용 VM 에 접속할 수 없다.
#   따라서 VM 안에 self-hosted runner 를 띄우고, runner 가 GitHub 로
#   **바깥으로** 폴링해서 작업을 가져온다.
#   → 공유기 포트포워딩 / 인바운드 방화벽 구멍이 0개다.
#
# ★ CI 게이트
#   workflow_run 으로 CI 성공만 받는다. 테스트가 깨진 커밋은 배포되지 않는다.
#
# ★ 안전장치
#   1) SECURITY_MODE=secure 강제 — vulnerable 빌드는 절대 배포/노출되지 않는다
#   2) 배포 전 현재 이미지 태그를 저장 → 헬스체크 실패 시 자동 롤백
#   3) 배포 결과를 deployments 테이블에 기록 → 관리자 대시보드에서 확인 (요구사항 #3)
# ==========================================================================

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "마이그레이션 건너뛰기"
        type: boolean
        default: false

concurrency:
  group: deploy-vm
  cancel-in-progress: false   # 배포는 중간에 끊으면 안 된다

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (self-hosted runner in VM)
    # VM 안에 설치한 러너에서만 실행된다 (scripts/setup_runner.sh 가 이 라벨을 붙인다)
    runs-on: [self-hosted, linux, vmlab]
    timeout-minutes: 20

    # CI 가 성공했을 때만. 수동 실행(workflow_dispatch)은 예외로 허용한다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment: production

    env:
      # ★ 하드코딩. 이 값을 secrets 나 input 으로 빼지 않는 것이 의도다.
      #   실수로 vulnerable 이 주입되면 취약한 앱이 인터넷에 노출된다.
      SECURITY_MODE: secure
      COMPOSE_PROJECT_NAME: vmlab
      APP_VERSION: v${{ github.run_number }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          # workflow_run 은 기본적으로 기본 브랜치를 받으므로 명시한다
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: 배포 대상 커밋 확인
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "배포 대상: ${SHA:0:7} / ${{ env.APP_VERSION }}"

      # ----------------------------------------------------------------
      # .env 생성 — 비밀값은 전부 GitHub Secrets 에서 주입한다.
      # 레포에는 .env.example 만 있고 실제 .env 는 커밋되지 않는다.
      # ----------------------------------------------------------------
      - name: 환경변수 파일 생성
        run: |
          umask 077   # .env 는 600 으로 만든다
          cat > .env <<EOF
          FLASK_ENV=production
          SECURITY_MODE=${SECURITY_MODE}

          SECRET_KEY=${{ secrets.SECRET_KEY }}

          DB_HOST=db
          DB_PORT=3306
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_POOL_SIZE=5
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}

          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_INITIAL_PASSWORD=${{ secrets.ADMIN_INITIAL_PASSWORD }}

          SESSION_COOKIE_SECURE=true
          SESSION_LIFETIME_MIN=60
          LOGIN_MAX_ATTEMPTS=5
          LOGIN_LOCKOUT_MINUTES=15

          UPLOAD_DIR=/app/uploads
          MAX_UPLOAD_MB=5
          TRUSTED_PROXY_COUNT=2
          ACCESS_LOG_RETENTION_DAYS=90

          BIND_ADDR=127.0.0.1
          HTTP_PORT=8080

          APP_VERSION=${APP_VERSION}
          GIT_COMMIT=${{ steps.meta.outputs.sha }}
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          EOF
          echo ".env 생성 완료 (권한: $(stat -c %a .env))"

      - name: 배포 전 상태 저장 (롤백용)
        id: prev
        run: |
          # 현재 돌고 있는 이미지 ID 를 기록해둔다.
          # 헬스체크가 실패하면 이 이미지로 되돌린다.
          PREV=$(docker compose images -q web 2>/dev/null | head -1 || true)
          echo "image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "이전 이미지: ${PREV:-없음 (최초 배포)}"

      - name: 이미지 빌드
        run: |
          docker compose build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg GIT_COMMIT="${{ steps.meta.outputs.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            web

      - name: DB 컨테이너 기동 및 대기
        run: |
          docker compose up -d db
          for i in $(seq 1 60); do
            if [ "$(docker compose ps -q db | xargs -r docker inspect \
                 -f '{{.State.Health.Status}}' 2>/dev/null)" = "healthy" ]; then
              echo "DB 준비 완료 (${i}초)"; break
            fi
            sleep 1
          done

      - name: 스키마 마이그레이션
        if: ${{ !inputs.skip_migration }}
        run: |
          # 앱 컨테이너 안에서 실행 — DB 는 internal 네트워크라 호스트에서 못 붙는다.
          docker compose run --rm --no-deps -T \
            --entrypoint python3 web scripts/migrate.py

      - name: 관리자 계정 보장
        run: |
          docker compose run --rm --no-deps -T \
            --entrypoint python3 web scripts/bootstrap_admin.py

      # ----------------------------------------------------------------
      # 실제 교체. deploy.sh 가 헬스체크 게이트와 롤백을 담당한다.
      # ----------------------------------------------------------------
      - name: 배포 실행 (헬스체크 게이트 + 자동 롤백)
        id: rollout
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

      - name: 배포 이력 기록 (관리자 대시보드용)
        if: always()
        run: |
          docker compose run --rm --no-deps -T \
            --entrypoint python3 web scripts/record_deploy.py \
              --commit "${{ steps.meta.outputs.sha }}" \
              --ref "${{ github.ref_name }}" \
              --version "${APP_VERSION}" \
              --actor "${{ github.actor }}" \
              --mode "${SECURITY_MODE}" \
              --note "${{ steps.rollout.outcome == 'success' && '배포 성공' || '배포 실패 → 롤백' }}" \
            || echo "::warning::배포 이력 기록 실패 (배포 자체에는 영향 없음)"

      - name: 배포 후 검증
        run: |
          echo "----- 컨테이너 상태 -----"
          docker compose ps
          echo "----- /healthz -----"
          curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/healthz.json
          echo ""
          # 배포된 리비전이 정말 방금 push 한 커밋인지 확인한다.
          DEPLOYED=$(python3 -c \
            "import json;print(json.load(open('/tmp/healthz.json'))['commit'])")
          EXPECTED="${{ steps.meta.outputs.short }}"
          if [ "${DEPLOYED}" != "${EXPECTED}" ]; then
            echo "::error::배포된 커밋(${DEPLOYED}) != 기대값(${EXPECTED})"
            exit 1
          fi
          echo "✅ 리비전 확인: ${DEPLOYED}"

          # secure 모드가 아니면 즉시 실패시킨다 (최후 방어선)
          MODE=$(python3 -c \
            "import json;print(json.load(open('/tmp/healthz.json'))['mode'])")
          if [ "${MODE}" != "secure" ]; then
            echo "::error::배포본이 secure 모드가 아닙니다 (mode=${MODE})"
            exit 1
          fi
          echo "✅ 보안 모드 확인: ${MODE}"

      - name: 외부 공개 터널 기동
        # secure 모드 검증을 통과한 뒤에만 터널을 올린다.
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" ]; then
            docker compose --profile tunnel up -d cloudflared
            echo "Cloudflare Tunnel 기동됨"
          else
            echo "::notice::CLOUDFLARE_TUNNEL_TOKEN 미설정 — 외부 공개 없이 로컬만 서비스"
          fi

      - name: 사용하지 않는 이미지 정리
        if: always()
        run: docker image prune -f --filter "until=168h" || true

      - name: 배포 요약
        if: always()
        run: |
          {
            echo "## 배포 결과: ${{ steps.rollout.outcome }}"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| 커밋 | \`${{ steps.meta.outputs.short }}\` |"
            echo "| 버전 | ${{ env.APP_VERSION }} |"
            echo "| 모드 | ${{ env.SECURITY_MODE }} |"
            echo "| 실행자 | ${{ github.actor }} |"
            echo ""
            echo "배포 이력은 관리자 대시보드 \`/admin/deployments\` 에서 확인할 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"
