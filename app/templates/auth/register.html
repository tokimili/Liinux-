{% extends "base.html" %}
{% block title %}회원가입{% endblock %}

{% block content %}
<section id="register-section" class="auth-wrap">
  <div class="auth-card panel">
    <header class="panel-head">
      <h1>회원가입</h1>
    </header>

    <form method="post" action="{{ url_for('auth.register') }}" class="stack-form">
      {% if not is_vulnerable %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% endif %}

      <div class="field">
        <label for="reg-username">아이디</label>
        <input type="text" id="reg-username" name="username"
               value="{{ username or '' }}" required
               pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32"
               autocomplete="username" autofocus>
        <small class="hint">영문·숫자·밑줄 3~32자</small>
      </div>

      <div class="field">
        <label for="reg-email">이메일</label>
        <input type="email" id="reg-email" name="email"
               value="{{ email or '' }}" required maxlength="190"
               autocomplete="email">
      </div>

      <div class="field">
        <label for="reg-password">비밀번호</label>
        <input type="password" id="reg-password" name="password"
               required minlength="10" maxlength="200"
               autocomplete="new-password">
        <small class="hint">10자 이상. 흔한 비밀번호는 거부됩니다.</small>
      </div>

      <div class="field">
        <label for="reg-password2">비밀번호 확인</label>
        <input type="password" id="reg-password2" name="password2"
               required minlength="10" maxlength="200"
               autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">가입하기</button>
    </form>

    <p class="auth-alt">
      이미 계정이 있으신가요?
      <a href="{{ url_for('auth.login') }}">로그인</a>
    </p>
  </div>
</section>
{% endblock %}
